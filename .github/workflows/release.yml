# Pushing a tag vX.Y.Z (make publish VERSION=X.Y.Z) builds, tests and publishes a GitHub release. Installed
# helpers read latest.json from the newest release and offer the update (helper/internal/update).
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: payload/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: helper/go.mod
          cache-dependency-path: helper/go.sum
      - run: npm ci
        working-directory: payload
      # Checks, then the Mac .dmg + update zip and the Windows .exe (cross-compiled).
      - run: make release VERSION=${GITHUB_REF_NAME#v}
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            dist/SpotifyCustom.dmg
            dist/SpotifyCustom-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            dist/SpotifyCustom.exe
            helper/internal/inject/payload.js

  windows:
    needs: mac
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: helper/go.mod
          cache-dependency-path: helper/go.sum
      - uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: build
      - name: Test the helper on Windows
        shell: bash
        run: |
          cp build/helper/internal/inject/payload.js helper/internal/inject/payload.js
          cd helper && go vet ./... && go test ./...
      - name: Build the installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=$version" "/DSourceExe=$PWD\build\dist\SpotifyCustom.exe" "/DOutDir=$PWD\out" `
            helper\packaging\windows\SpotifyCustom.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/SpotifyCustom-Setup.exe

  publish:
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Manifest and checksums
        run: |
          cd artifacts
          ../helper/packaging/manifest.sh "${GITHUB_REF_NAME#v}" "$GITHUB_REPOSITORY" SpotifyCustom-mac.zip SpotifyCustom-Setup.exe > latest.json
          cat latest.json
          shasum -a 256 SpotifyCustom.dmg SpotifyCustom-mac.zip SpotifyCustom-Setup.exe > SHA256SUMS.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artifacts
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Spotify Custom ${GITHUB_REF_NAME#v}" --generate-notes \
            SpotifyCustom.dmg SpotifyCustom-Setup.exe SpotifyCustom-mac.zip latest.json SHA256SUMS.txt
